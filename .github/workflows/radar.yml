name: New-term radar (free, 中文)

on:
  schedule:
    - cron: '17 0,8,16 * * *'
    - cron: '47 1 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: '采集类型'
        type: choice
        options: [daily, sources]
        default: daily
  # 配置提交会执行免费日报，用于部署后的首次验证。
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
      - 'config.json'

concurrency:
  group: radar-free
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    # 自动开启；如需暂停，在仓库 Variables 设置 RADAR_ENABLED=false。
    if: vars.RADAR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '17 0,8,16 * * *' && 'sources' || 'daily') }}
      # 仅使用 GitHub 自带的临时 token。不读取或注入任何付费 API 密钥。
      AISA_API_KEY: ''
      GOANYAPI_API_KEY: ''
      TRUSTMRR_API_KEY: ''
      GSC_TOKEN_JSON: ''
      RESEND_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 免费采集只依赖 Python 标准库，无需安装邮件或 MCP 依赖。
      - name: Restore snapshots and database
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-free-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-free-state-v1-
      - name: Collect free sources and generate Chinese report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMAND" == 'sources' ]]; then
            python -m radar sources --skip x,judge --out report.md 2>&1 | tee run.log
          elif [[ "$COMMAND" == 'daily' ]]; then
            python -m radar daily --skip x,judge,newsites,asks,sellers,review,usecases,tutorials,revenue,gsc --out report.md 2>&1 | tee run.log
          else
            echo 'Unsupported command' >&2
            exit 1
          fi
          if [[ -s report.md ]]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## 新词雷达：免费采集完成\n\n首次建立基线或本次无新增词。\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat run.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check daily source health
        if: env.COMMAND == 'daily'
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('report.json').read_text())
          errors = []
          for source in ('hf', 'breakout'):
              block = data[source]
              print(f"{source}: {json.dumps(block, ensure_ascii=False)[:400]}")
              if block.get('error') or block.get('skipped'):
                  errors.append(source)
          sites = data['sitemap'].get('sites', {})
          for name, result in sites.items():
              print(f"sitemap {name}: {json.dumps(result, ensure_ascii=False)}")
              if result.get('error'):
                  print(f"::warning::Sitemap {name} failed")
          if sites and all(result.get('error') for result in sites.values()):
              errors.append('all sitemaps')
          if errors:
              raise SystemExit('Free source errors: ' + ', '.join(errors))
      - name: Save snapshots and database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-free-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep report, logs and complete state backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-free-${{ env.COMMAND }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            report.json
            run.log
            state/
          if-no-files-found: warn
          retention-days: 14
